  alert-hover: "<color:{color}><bold><check></bold></color><newline><gray>Oyuncu: <white><player></white><newline>Ping: <white><ping> ms</white><newline>Toplam VL: <white><total></white><newline><dark_gray><detail></dark_gray><newline><yellow>Tıkla: oyuncu detayları"
  state-on: "<green>AÇIK</green>"
