# ═══════════════════════════════════════════════════════════════
#  ZornoGuard - Kill Aura / Reach / Duvar arkası vuruş koruması
#  Değişiklikten sonra:  /zg yenile
# ═══════════════════════════════════════════════════════════════

general:
  # Şüpheli vuruşu iptal et (hile işe yaramaz hale gelir, ceza vermeden bile korur)
  cancel-hits: true
  # Eşiklere oyuncu başına çok küçük rastgele sapma ekler (hile yazarı tam sınırı öğrenemesin)
  randomize-thresholds: true
  # Bu yetkilerden biri varsa oyuncu kontrol edilmez (eski Skript'teki anticheat.bypass da çalışır)
  bypass-permissions:
    - zornoguard.bypass
    - anticheat.bypass
  # Giriş/ışınlanma/dünya değişiminden sonra konum tabanlı kontroller bu kadar tick atlanır (20 tick = 1 sn)
  grace-ticks: 20
  # Ping telafisi için en fazla kaç tick geriye bakılır (10 = ~500 ms). Yükseltmek hileci lehine tolerans artırır.
  max-compensation-ticks: 10
  # Sunucu tick'i bu süreden (ms) uzun sürerse bir süre konum kontrolleri durur (lag'de yanlış alarm olmasın)
  lag-guard-ms: 130
  lag-guard-ticks: 15
  # TPS bunun altına düşerse ağır "duvar" ışın kontrolü atlanır (sunucuyu korur)
  wall-min-tps: 14

decay:
  # Her aralıkta tüm VL'lerden bu kadar düşer
  amount: 1.0
  interval-seconds: 3

checks:
  # ── REACH: gecikme telafili erişim ölçümü (oyuncunun lehine en küçük mesafe alınır)
  reach:
    enabled: true
    tolerance: 0.15          # vanilla menzile (3.0) eklenen sabit tolerans
    speed-factor: 0.5        # hıza göre ek tolerans (elytra/koşma için)
    hard-margin: 0.35        # limitin bu kadar üstü = kesin ihlal
    soft-weight: 1.0
    hard-weight: 2.5
    buffer: 2.0              # sınırda ihlaller için tampon
    check-mobs: true
    cancel: true
    mob-extra: 0.45
    vehicle-extra: 0.75
    legacy-extra: 0.10
    sneak-extra: 0.36
    stat-margin: 0.12        # durağanken 3.1-3.3 gibi küçük reach için istatistik eşiği
    stat-buffer: 4.0
    stat-weight: 1.0
    stat-max-speed: 0.12

  # ── AIM: nişan çizgisi hedefin kutusuna değmiyorsa (kill aura, hitbox, ters bakarak vurma)
  aim:
    enabled: true
    allow: 0.25
    soft-margin: 0.30
    hard-margin: 1.20
    soft-weight: 1.0
    hard-weight: 2.5
    buffer: 2.0
    check-mobs: true
    flip-detection: true     # ani 180° dönüş / birebir aynı dönüş (eski Skript mantığı)
    flip-weight: 1.0

  # ── WALL: duvar arkası vuruş (tüm göz/kutu adayları ve 15 örnek nokta ile)
  wall:
    enabled: true
    weight: 2.5
    look-weight: 1.0
    look-buffer: 2.0
    check-mobs: true
    cancel: true

  # ── INSIDE: göz konumu katı bloğun / örümcek ağının içindeyken vuruş
  inside:
    enabled: true
    solid-weight: 2.5
    solid-cancel: true
    web-weight: 0.75
    web-buffer: 3.0
    # Ağ içinde vuruşlarda varsayılan olarak sadece uyarı verir. Trap PvP'de yanlış alarm
    # görmezsen true yapıp iptal etmeyi açabilirsin.
    web-cancel: false

  # ── SILENT: yalnızca vuruş anında hedefe bakıp geri dönen (sessiz rotasyon) aura imzası
  silent:
    enabled: true
    small-angle: 25.0
    big-angle: 50.0
    min-turn: 45.0
    net-ratio: 0.4
    weight: 2.0
    buffer: 2.0

  # ── MULTI: çoklu hedef / hedef değiştirme
  multi:
    enabled: true
    window-ms: 80            # bu süre içinde farklı hedefe vuruş (eski Skript: 80 ms)
    weight: 2.0
    switch-ms: 110
    switch-angle: 60.0
    switch-weight: 1.0
    switch-targets: 4
    switch-targets-ms: 800

  # ── ACTION: vanilla istemcinin yapamayacağı eylemler
  action:
    enabled: true
    check-using-item: true   # yerken/blok yaparken/yay çekerken vuruş (1.8 istemciler otomatik muaf, ViaVersion varsa)
    check-inventory: true    # sandık/menü açıkken vuruş
    using-weight: 2.0
    using-buffer: 2.0
    inventory-weight: 3.0
    inventory-grace-ms: 400
    rotation-weight: 3.0

  # ── RATE: vuruş hızı
  rate:
    enabled: true
    max-cps: 17              # eski Skript değeri
    weight: 0.5
    cancel: true
    constant-window: 20      # bu kadar vuruşluk pencerede sabit aralık aranır
    constant-mean-max-ms: 250
    constant-std-ms: 5.0
    constant-mode-ratio: 0.92
    constant-weight: 1.0
    constant-buffer: 3.0

  # ── SWING: vuruş var ama kol sallama paketi yok
  swing:
    enabled: true
    wait-ticks: 3
    buffer: 4.0
    weight: 1.0

alerts:
  min-vl: 1.0                # bu kontrolün VL'si bunun altındayken uyarı gösterme
  cooldown-ms: 1500          # aynı oyuncu+kontrol için en sık bu aralıkla uyarı (spam olmasın)
  console: true

log:
  file: true                 # plugins/ZornoGuard/logs/flags-YYYY-AA-GG.log (ayrı thread'de yazılır)
  console: false
  cooldown-ms: 500           # aynı oyuncu+kontrol için en sık bu aralıkla log satırı
  retention-days: 14
  memory-lines: 300          # /zg log için bellekte tutulan son kayıt sayısı

punishments:
  # Önce birkaç gün sadece uyarıları/logu izle, sonra true yap.
  enabled: false
  steps:                     # TOPLAM VL bu değere ulaşınca komutlar konsoldan çalışır
    - vl: 15
      commands:
        - "kick {player} Combat: hile şüphesi (otomatik)"
    - vl: 30
      commands:
        - "ban {player} Combat Unfair Advantage"

