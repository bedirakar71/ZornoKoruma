  unknown-sub: "{prefix}<red>Bilinmeyen alt komut.</red> <gray>/<label> yardım</gray>"
  usage-info: "{prefix}<gray>Kullanım:</gray> <white>/zg bilgi [oyuncu]</white>"
  usage-reset: "{prefix}<gray>Kullanım:</gray> <white>/zg sıfırla [oyuncu]</white>"
